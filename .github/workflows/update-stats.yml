name: update stats card

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      brain_data:
        description: 'JSON blob with xp, omega, energy, statsLog keys'
        required: false

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: generate card
        env:
          BRAIN_DATA: ${{ github.event.inputs.brain_data || '' }}
        run: |
          if [ -z "$BRAIN_DATA" ]; then
            echo "no brain data provided, skipping generation"
            exit 0
          fi
          node generate-card.js

      - name: commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats-card.svg
          git diff --staged --quiet && exit 0
          git commit -m "update stats card"
          git push
